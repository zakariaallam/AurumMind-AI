[project]
name = "aurummind-ai"
version = "0.1.0"
description = "Advanced AI platform for Gold (XAUUSD) market research and probabilistic forecasting"
readme = "README.md"
authors = [
    { name = "zakaria allam", email = "zakariaallam536@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "torch>=2.2.0",
    "mlflow>=2.10.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "pytest>=8.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "python-dotenv>=1.0.0",
    "apache-airflow>=2.8.0",
    "psycopg2-binary>=2.9.0",
    "shap>=0.44.0",
]

[project.scripts]
aurummind-ai = "aurummind_ai:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
