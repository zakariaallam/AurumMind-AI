
project:
  name: AurumMind AI
  instrument: XAUUSD
  data_source: Dukascopy

data:
  base_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

timeframes:
  - 1h
  - 4h
  - 1d

columns:
  timestamp: timestamp
  open: open
  high: high
  low: low
  close: close
  volume: volume

validation:
  timezone: UTC
  allow_negative_prices: false
  require_unique_timestamps: true

features:
  technical_indicators:
    sma_periods: [20, 50, 200]
    ema_periods: [9, 20, 50, 200]
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bb_period: 20
    bb_std: 2.0
    atr_period: 14
    adx_period: 14
    stoch_k: 14
    stoch_d: 3
    roc_period: 12
    include_obv: true
  
  price_action:
    return_periods: [1, 3, 5, 10, 20]
    rolling_windows: [5, 10, 20]
    momentum_periods: [3, 5, 10, 20]
    lookback_structure: 5
    support_resistance_window: 20
  
  handling:
    missing_values: forward_fill  # forward_fill, drop, or interpolate
    min_required_rows: 200
